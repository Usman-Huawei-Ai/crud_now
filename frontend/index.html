<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users</title>
<style>
  :root {
    --bg: #eef2f4;
    --panel: #ffffff;
    --ink: #14272e;
    --muted: #5b6e76;
    --line: #d6dee2;
    --accent: #0f6b66;
    --accent-dark: #0a504c;
    --danger: #b3261e;
    --ok: #1d6b3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 1.05rem; margin: 0 0 14px; }

  form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  label { display: flex; flex-direction: column; font-size: 0.85rem; color: var(--muted); gap: 4px; }
  input {
    font: inherit;
    color: var(--ink);
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
  }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .actions { grid-column: 1 / -1; display: flex; gap: 10px; }

  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 8px 16px;
  }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover { background: var(--accent-dark); }
  .ghost { background: #fff; border-color: var(--line); color: var(--ink); }
  .ghost:hover { background: var(--bg); }
  .small { padding: 5px 11px; font-size: 0.85rem; }
  .danger { background: #fff; border-color: var(--danger); color: var(--danger); }
  .danger:hover { background: var(--danger); color: #fff; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .toolbar h2 { margin: 0; }
  .toolbar input { width: 240px; max-width: 100%; }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  tr.editing td { background: #e3f1ef; }
  td.row-actions { display: flex; gap: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; }

  #message {
    min-height: 22px;
    margin-bottom: 12px;
    font-size: 0.92rem;
  }
  #message.error { color: var(--danger); }
  #message.success { color: var(--ok); }

  @media (max-width: 600px) {
    form { grid-template-columns: 1fr; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar input { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Users</h1>
  <p class="sub">Add, edit and remove people stored in your MySQL users table.</p>

  <div id="message" role="status" aria-live="polite"></div>

  <section class="panel">
    <h2 id="formTitle">Add a user</h2>
    <form id="userForm">
      <label>Name
        <input id="name" required maxlength="100" placeholder="Ali Khan">
      </label>
      <label>Email
        <input id="email" type="email" required maxlength="150" placeholder="ali@example.com">
      </label>
      <label>Phone
        <input id="phone" maxlength="20" placeholder="03001234567">
      </label>
      <label>City
        <input id="city" maxlength="100" placeholder="Lahore">
      </label>
      <div class="actions">
        <button type="submit" class="primary" id="saveBtn">Add user</button>
        <button type="button" class="ghost" id="cancelBtn" hidden>Cancel edit</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="toolbar">
      <h2>All users</h2>
      <input id="search" type="search" placeholder="Search by name, email or city" aria-label="Search users">
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>City</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
  // Change this if your backend runs on a different port
  const API = "http://localhost:3000/users";

  const form = document.getElementById("userForm");
  const fields = {
    name: document.getElementById("name"),
    email: document.getElementById("email"),
    phone: document.getElementById("phone"),
    city: document.getElementById("city"),
  };
  const formTitle = document.getElementById("formTitle");
  const saveBtn = document.getElementById("saveBtn");
  const cancelBtn = document.getElementById("cancelBtn");
  const tableBody = document.getElementById("tableBody");
  const searchInput = document.getElementById("search");
  const message = document.getElementById("message");

  let users = [];
  let editingId = null;

  function showMessage(text, type) {
    message.textContent = text;
    message.className = type || "";
  }

  // ---------- READ ----------
  async function loadUsers() {
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error("Request failed");
      users = await res.json();
      renderTable();
    } catch (err) {
      showMessage("Can't reach the server. Make sure server.js is running on port 3000.", "error");
    }
  }

  function renderTable() {
    const q = searchInput.value.trim().toLowerCase();
    const list = users.filter(u =>
      [u.name, u.email, u.city].some(v => (v || "").toLowerCase().includes(q))
    );

    tableBody.innerHTML = "";

    if (list.length === 0) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 6;
      td.className = "empty";
      td.textContent = users.length === 0
        ? "No users yet. Add the first one above."
        : "No users match your search.";
      tr.appendChild(td);
      tableBody.appendChild(tr);
      return;
    }

    list.forEach(u => {
      const tr = document.createElement("tr");
      if (u.id === editingId) tr.className = "editing";

      [u.id, u.name, u.email, u.phone || "", u.city || ""].forEach(val => {
        const td = document.createElement("td");
        td.textContent = val;
        tr.appendChild(td);
      });

      const actions = document.createElement("td");
      actions.className = "row-actions";

      const editBtn = document.createElement("button");
      editBtn.className = "ghost small";
      editBtn.textContent = "Edit";
      editBtn.addEventListener("click", () => startEdit(u));

      const delBtn = document.createElement("button");
      delBtn.className = "danger small";
      delBtn.textContent = "Delete";
      delBtn.addEventListener("click", () => deleteUser(u));

      actions.append(editBtn, delBtn);
      tr.appendChild(actions);
      tableBody.appendChild(tr);
    });
  }

  // ---------- CREATE / UPDATE ----------
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = {
      name: fields.name.value.trim(),
      email: fields.email.value.trim(),
      phone: fields.phone.value.trim(),
      city: fields.city.value.trim(),
    };

    const isEdit = editingId !== null;
    const url = isEdit ? `${API}/${editingId}` : API;

    try {
      const res = await fetch(url, {
        method: isEdit ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        showMessage(data.error || "Could not save the user.", "error");
        return;
      }
      showMessage(isEdit ? "User updated." : "User added.", "success");
      resetForm();
      loadUsers();
    } catch (err) {
      showMessage("Can't reach the server. Make sure server.js is running on port 3000.", "error");
    }
  });

  // ---------- EDIT (fill the form) ----------
  function startEdit(u) {
    editingId = u.id;
    fields.name.value = u.name;
    fields.email.value = u.email;
    fields.phone.value = u.phone || "";
    fields.city.value = u.city || "";
    formTitle.textContent = `Edit user #${u.id}`;
    saveBtn.textContent = "Save changes";
    cancelBtn.hidden = false;
    showMessage("", "");
    renderTable();
    window.scrollTo({ top: 0, behavior: "smooth" });
    fields.name.focus();
  }

  function resetForm() {
    editingId = null;
    form.reset();
    formTitle.textContent = "Add a user";
    saveBtn.textContent = "Add user";
    cancelBtn.hidden = true;
  }

  cancelBtn.addEventListener("click", () => {
    resetForm();
    renderTable();
    showMessage("", "");
  });

  // ---------- DELETE ----------
  async function deleteUser(u) {
    if (!confirm(`Delete ${u.name}? This can't be undone.`)) return;
    try {
      const res = await fetch(`${API}/${u.id}`, { method: "DELETE" });
      const data = await res.json();
      if (!res.ok) {
        showMessage(data.error || "Could not delete the user.", "error");
        return;
      }
      if (editingId === u.id) resetForm();
      showMessage("User deleted.", "success");
      loadUsers();
    } catch (err) {
      showMessage("Can't reach the server. Make sure server.js is running on port 3000.", "error");
    }
  }

  searchInput.addEventListener("input", renderTable);

  loadUsers();
</script>
</body>
</html>
